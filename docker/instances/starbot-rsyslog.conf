template(name="StarbotDockerFile" type="string" string="/var/log/starbot/%programname%.log")
template(name="StarbotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="starbot-docker") {
  if $programname startswith "starbot-" then {
    action(type="omfile" dynaFile="StarbotDockerFile" template="StarbotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/starbot-docker/dev/log" ruleset="starbot-docker" createPath="off")
