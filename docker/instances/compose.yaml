services:
  starbot:
    image: ghcr.io/nightly-labs/starbot:${STARBOT_TAG:-latest}
    container_name: starbot-${STARBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${STARBOT_CPUS:?}
    mem_limit: ${STARBOT_MEM:?}
    memswap_limit: ${STARBOT_MEM:?}
    pids_limit: 8192
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${STARBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      - /run/starbot:mode=0700,uid=1000,gid=1000,size=64m
    volumes:
      - /srv/starbot/${STARBOT_NAME:?}/data:/data
      - /srv/starbot/${STARBOT_NAME:?}/update-requests:/var/lib/starbot-update/requests
      - /srv/starbot/${STARBOT_NAME:?}/update-status:/var/lib/starbot-update/status:ro
    networks:
      - starbot
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///var/lib/starbot-docker/dev/log
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m

networks:
  starbot:
    external: true
